services:
  backend:
    image: ghcr.io/not1sam/not1sam-backend:${VERSION}
    container_name: not1sam-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DEBUG=false
    volumes:
      - backend-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: not1sam-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
